# Render Blueprint for the Aeon Intelligence static frontend. On Render:
# New → Blueprint → connect this repo with Root Directory set to intelligence/frontend.
services:
    - type: web
      name: aeon-intelligence-app
      env: static
      buildCommand: npm install && npm run build
      staticPublishPath: ./dist
      envVars:
          - key: VITE_API_URL
            sync: false # set to the deployed API's real URL, e.g. https://aeon-intelligence-api.onrender.com
